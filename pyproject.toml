[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment-solver"
version = "0.1.0"
description = "Solve assignments into a templated .docx using your own locally fine-tuned open-source LLM (no paid APIs)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "python-docx>=1.1",
    "PyMuPDF>=1.24",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
assignment-solver = "assignment_solver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
